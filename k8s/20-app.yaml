apiVersion: apps/v1
kind: Deployment
metadata:
  name: labflow-app
  namespace: labflow
spec:
  replicas: 2
  selector:
    matchLabels: { app: labflow-app }
  template:
    metadata:
      labels: { app: labflow-app }
    spec:
      containers:
        - name: app
          image: labflow-lite:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef: { name: labflow-config }
          env:
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef: { name: labflow-secrets, key: DB_PASSWORD }
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef: { name: labflow-secrets, key: JWT_SECRET }
          resources:
            requests: { cpu: 100m, memory: 384Mi }
            limits: { memory: 768Mi }
          startupProbe:
            httpGet: { path: /actuator/health/liveness, port: 8080 }
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8080 }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8080 }
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: labflow-app
  namespace: labflow
spec:
  selector: { app: labflow-app }
  ports:
    - port: 80
      targetPort: 8080